# 本地联调用的 FreeSWITCH。用法见同目录 README.md。
services:
  freeswitch:
    build: .
    image: vca-freeswitch:local
    container_name: vca-freeswitch
    restart: unless-stopped
    # FreeSWITCH 控制台模式要一个开着的 stdin, 日志才走 stdout
    stdin_open: true
    tty: true
    environment:
      # 软电话眼里 FreeSWITCH 的地址。软电话和 Docker 在同一台机器上 = 127.0.0.1;
      # 要用手机上的软电话, 改成这台电脑的局域网 IP, 并把 SIP_BIND 改成 0.0.0.0。
      EXTERNAL_IP: ${EXTERNAL_IP:-127.0.0.1}
      SIP_PASSWORD: ${SIP_PASSWORD:?先设置 SIP_PASSWORD}
      ESL_PASSWORD: ${ESL_PASSWORD:?先设置 ESL_PASSWORD}
      # VCA 跑在宿主机上, 容器里用 host.docker.internal 访问
      VCA_HOST: ${VCA_HOST:-host.docker.internal}
      VCA_PORT: ${VCA_PORT:-8084}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 默认只绑回环: SIP 端口一旦暴露到网络上就会被扫号盗打
      - "${SIP_BIND:-127.0.0.1}:5060:5060/udp"
      - "${SIP_BIND:-127.0.0.1}:5060:5060/tcp"
      - "${SIP_BIND:-127.0.0.1}:16384-16403:16384-16403/udp"
      # 事件套接字只给本机的 VCA 用(外呼), 永远不对外。
      # 宿主机侧默认 18021 而不是 8021: macOS 上 8021 常被 launchd 占着(ftp-proxy)
      - "127.0.0.1:${ESL_HOST_PORT:-18021}:8021/tcp"
      # 注意: unicast 音频不需要映射端口 —— FreeSWITCH 先发包, VCA 按来源地址回包
    volumes:
      - ./conf:/conf:ro
      - ./recordings:/recordings
