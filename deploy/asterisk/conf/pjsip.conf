; 本地联调: 一个软电话分机 1000。@XXX@ 占位符由 entrypoint.sh 替换。

[global]
type=global
user_agent=vca-asterisk

; UDP 与 TCP 都开。Docker Desktop 的 UDP 转发偶尔不稳, 软电话注册不上时改用 TCP。
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; 容器在 Docker 的内网里, 软电话看到的是宿主机地址 —— 不写这两行就是"能接通但没声音"。
; 故意不配 local_net: 让所有对端都拿到外部地址(软电话经 Docker 转发进来, 源地址是网桥网关)。
external_media_address=@EXTERNAL_IP@
external_signaling_address=@EXTERNAL_IP@

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=@EXTERNAL_IP@
external_signaling_address=@EXTERNAL_IP@

[1000]
type=endpoint
context=ai-agent
disallow=all
allow=alaw,ulaw          ; 只放 G.711, 和真实电话线路一致(8k 窄带)
auth=1000-auth
aors=1000
direct_media=no          ; 媒体必须经过 Asterisk, 否则 AudioSocket 拿不到音频
rtp_symmetric=yes        ; RTP 回到"收到包的那个源地址" —— 穿 Docker 转发全靠它
force_rport=yes
rewrite_contact=yes
ice_support=no
dtmf_mode=rfc4733

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=@SIP_PASSWORD@

[1000]
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=0
