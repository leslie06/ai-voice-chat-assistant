; 本地联调 dialplan。@XXX@ 占位符由 entrypoint.sh 替换。

[general]
static=yes
writeprotect=yes

[ai-agent]
; ---- 5000: 接入 VCA 语音助手 ----
exten => 5000,1,NoOp(接入 VCA: 主叫=${CALLERID(num)})
 same => n,Answer()
 ; 第一个参数必须是合法 UUID: app_audiosocket 会真的解析它, 别用 ${UNIQUEID} 顶替。
 ; Ubuntu 的 Asterisk 20.6 没有 func_uuid(${UUID()} 不存在), 所以向内核要一个;
 ; tr 去掉行尾换行 —— 带着换行的 UUID 同样会解析失败。
 same => n,Set(CALLUUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 ; 联调期两个方向分开录音, 出问题时能听到底是哪一侧坏了:
 ;   rx = 软电话说的(上行), tx = VCA 回的(下行)。文件在 ./recordings/。
 same => n,MixMonitor(${CALLUUID}.wav,r(${CALLUUID}-rx.wav)t(${CALLUUID}-tx.wav))
 same => n,AudioSocket(${CALLUUID},@VCA_HOST@:@VCA_PORT@)
 same => n,Hangup()

; ---- 6000: 回声测试。不经过 VCA, 专门用来验证"软电话 ↔ Asterisk"这一段的双向音频 ----
; 5000 没声音时先拨这个: 听得到自己 = SIP/RTP 这段没问题, 毛病在 AudioSocket/VCA 那一侧。
exten => 6000,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ---- s: 外呼接通后进这里(AMI Originate 带 CALLUUID 变量), 见 docs/10 §9.2 ----
exten => s,1,NoOp(外呼接通: ${CALLUUID})
 same => n,AudioSocket(${CALLUUID},@VCA_HOST@:@VCA_PORT@)
 same => n,Hangup()
