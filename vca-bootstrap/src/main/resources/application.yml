server:
  port: 8080

spring:
  config:
    # 直接用 mvn/IDE 启动时也读取项目根目录 .env；run.sh 仍会显式 source .env。
    # 第二个路径兼容工作目录在 vca-bootstrap 模块内的启动方式。
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  # 对话落库(vca-store)自带连接池、手动装配 MyBatis-Plus 并自行建表, 不走 Boot 的 DataSource 自动装配。
  # 必须排除它: 否则 classpath 上的 MySQL 驱动会触发 Boot 自动配 DataSource, 而未配 url 时启动直接失败。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  application:
    name: voice-chat-assistant
  profiles:
    # 默认激活 real: 全链路真实厂商(阿里云 ASR + Qwen/CosyVoice TTS + DeepSeek LLM)。
    active: ${SPRING_PROFILES_ACTIVE:real}

logging:
  level:
    com.vca: DEBUG

# 可观测性: 健康检查 + 指标。注意这些 HTTP 端点当前无鉴权, 公网部署建议用反向代理限制 /actuator。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

vca:
  web:
    path: /ws/voice
    # 当前仅开放三段式链路: ASR → LLM → TTS。
    mode: pipeline
    asr-vendor: aliyun
    llm-vendor: ${VCA_LLM_VENDOR:deepseek}    # deepseek / qwen / moonshot
    llm-model: ${VCA_LLM_MODEL:}
    tts-vendor: aliyun
    tts-voice: longxiaochun
    # 端到端模式(mode=s2s)厂商/模型/音色; model/voice 留空用 provider 默认。
    s2s-vendor: qwen
    s2s-model: ${VCA_S2S_MODEL:}
    s2s-voice: ${VCA_S2S_VOICE:}
    # 持久 S2S(P2): 端到端免提用"一条长连+服务端 VAD"真全双工(原生打断/低延迟), 取代每轮一连接。
    # 仅 mode=s2s + 免提下生效; PTT/三段式不受影响。真机不稳可设 false 回退每轮 S2S。
    s2s-persistent: ${VCA_S2S_PERSISTENT:true}
    # 多步 Agent 规划(P1): 命中多步意图的复杂回合先让模型出分步计划, 注入工具回合循环引导逐步执行;
    # 普通/单步回合零额外延迟按原路走。需配合工具(tools-enabled), 仅走 LLM 的回合生效; 默认关。
    agent-enabled: ${VCA_AGENT_ENABLED:true}
    # 视觉模型(多模态): 回合上下文含图片时该轮自动改用它(需支持 OpenAI 兼容 image_url 输入)。
    # 走 DashScope 的 qwen 客户端(复用 DASHSCOPE_API_KEY)。留空=不切换(带图回合用当前对话模型)。
    vision-vendor: qwen
    vision-model: ${VCA_VISION_MODEL:qwen-vl-plus}
    # 提示词(人设/语气/约束)。pipeline 与 s2s 共用; s2s 下每回合作为 Qwen-Omni 的
    # response.create.instructions 下发。长提示词写在文件末尾的 prompts: 段(块标量 | , 免转义),
    # 这里只引用它; 换人设=改那段, 或把引用指向别的 key。也可用 VCA_SYSTEM_PROMPT 整段覆盖。
    system-prompt: ${VCA_SYSTEM_PROMPT:${prompts.voice-assistant}}
    # 共享访问令牌: 留空=不校验(本地开发)。公网部署务必用环境变量 VCA_AUTH_TOKEN 设一个。
    auth-token: ${VCA_AUTH_TOKEN:}
    # 单会话最长存活秒数(防连着不挂烧账单); 同时在线连接上限。0=不限。
    max-session-seconds: ${VCA_MAX_SESSION_SECONDS:3600}
    max-connections: ${VCA_MAX_CONNECTIONS:8}
    # 高德 Web 服务 key: 查天气工具(get_weather)用。留空=不注册该工具。
    # 申请: https://console.amap.com → 应用管理 → Key(类型选"Web服务")。
    amap-key: ${AMAP_API_KEY:}
    # 博查 Bocha 联网搜索 key: web_search 工具 + 时效问题自动注入用。留空=联网搜索关闭(仅 Qwen 内置 enable_search 生效)。
    # 申请: https://open.bochaai.com 。web-search-auto=false 可只保留工具、关掉自动注入。
    bocha-key: ${BOCHA_API_KEY:}
    web-search-auto: ${VCA_WEB_SEARCH_AUTO:true}
    web-search-count: ${VCA_WEB_SEARCH_COUNT:5}
    web-search-freshness: ${VCA_WEB_SEARCH_FRESHNESS:noLimit}
    vad:
      # 免提开口/断句检测。use-silero=true 用 Silero(ONNX)语义级 VAD, 抗噪更好;
      # false(默认)用能量阈值法。模型加载失败会自动降级回能量法, 不影响启动。
      use-silero: ${VCA_VAD_SILERO:false}
      # 自定义 Silero 模型路径; 留空用打包进 jar 的默认 silero_vad.onnx。
      silero-model-path: ${VCA_VAD_SILERO_MODEL:}
      # 阈值与所选检测器同尺度: 能量法约 0.015/0.020; Silero 为人声概率, 开了 use-silero
      # 又没显式改这两个值时会自动取 0.5/0.6。其余 onset-ms/silence-ms/barge-ms/preroll-ms 通用。
      #
      # --- 抗"回声自打断"调钝(S2S 外放扬声器时尤其需要) ---
      # 打断阈值抬高: 让机器人自己的回声够不着, 只有你明显更响的真插话才打断。
      # 外放还自打断就继续往上调(0.08/0.1…); 戴耳机可调回更灵敏(0.02)。
      barge-threshold: ${VCA_VAD_BARGE_THRESHOLD:0.05}
      # 需持续这么久的人声才算打断(ms), 滤掉短促回声/杂音。
      barge-ms: ${VCA_VAD_BARGE_MS:400}
      # 起播保护期(ms): 机器人开口后这段时间内绝不打断, 防被自己头几个字的回声掐断。
      barge-grace-ms: ${VCA_VAD_BARGE_GRACE_MS:600}
      # 预滚(ms): 开口/打断瞬间, 先把之前这么久的音频随首帧补发给 ASR, 不切掉第一个字。
      # 关键: 必须 > barge-ms —— 打断要 barge-ms 持续人声才确认, 真人音量起伏会让确认的实际
      # 墙钟时间超过 barge-ms, 若预滚只等于 barge-ms, 最早一两个字就滚出缓冲被切掉。留足余量。
      preroll-ms: ${VCA_VAD_PREROLL_MS:700}
      # --- 句尾判停: 静音多久算"你说完了" ---
      # 学英语爱停顿找词, 默认 800ms 太短会把半句话提前提交、模型只听到片段→答非所问。
      # 调大给你留出停顿空间; 太大则你说完后要多等一会儿才回复。1000~1500 之间按习惯权衡。
      silence-ms: ${VCA_VAD_SILENCE_MS:1200}
      # --- 语义端点判定(自适应断句, 仅三段式生效) ---
      # 开启后句尾静音阈值随 ASR 中间转写的"完整度"自适应: 末尾是连词/口头停顿(然后…/那个…)→拉长多等,
      # 句末有标点(。？)→缩短更快回复。这样既不会把停顿找词的你切断, 说完了又能snappy响应。
      semantic-endpoint: ${VCA_VAD_SEMANTIC_ENDPOINT:false}
      min-silence-ms: ${VCA_VAD_MIN_SILENCE_MS:400}    # "已说完"时下限
      max-silence-ms: ${VCA_VAD_MAX_SILENCE_MS:1600}   # "没说完"时上限
      # 开口判定: 人声需持续这么久(ms)才算开口, 顺带过滤短促杂音/咳嗽误触发新一轮。
      onset-ms: ${VCA_VAD_ONSET_MS:200}
      # 开口阈值: 超过即算"有人声"。与检测器同尺度 —— 能量法约 0.015; Silero 是人声概率(0~1),
      # 留空(0.015)时开了 Silero 会自动取 0.5。说话识别不到就调低(Silero 试 0.3, 能量法试 0.01)。
      speech-threshold: ${VCA_VAD_SPEECH_THRESHOLD:0.015}
      # --- 半双工(默认开): 机器人说话期间不收麦、不语音打断 ---
      # 外放无回声消除时, 这是断掉"自己声音→麦克风→不停重复"死循环的根治开关。
      # 代价: 不能用语音随时插嘴(想打断点屏幕 ⏹ 按钮)。戴耳机/有 AEC 时设 false 可恢复全双工语音打断。
      half-duplex: ${VCA_VAD_HALF_DUPLEX:false}

  # 对话落库(数据飞轮 P1): MySQL + MyBatis-Plus。开启后每轮对话异步写入 conversation_turn 表,
  # 供后续评测(延迟/失败率/误打断率/WER 抽样)。需先建库(CREATE DATABASE vca), 表由启动时 schema.sql 幂等建。
  # 凭据(密码)放 .env(VCA_STORE_*), 不进 yaml; 默认 enabled=false, 用 .env 打开。
  store:
    enabled: ${VCA_STORE_ENABLED:false}
    url: '${VCA_STORE_URL:jdbc:mysql://localhost:3306/vca?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}'
    username: ${VCA_STORE_USERNAME:root}
    password: ${VCA_STORE_PASSWORD:}
    queue-capacity: ${VCA_STORE_QUEUE_CAPACITY:1000}
    # OSS 录音（用户/客服原始双轨 + 按回合排列的 conversation.wav），不落服务器磁盘。
    audio-recording-enabled: ${VCA_AUDIO_RECORDING_ENABLED:false}
    audio-recording-queue-capacity: ${VCA_AUDIO_RECORDING_QUEUE_CAPACITY:2048}
    # 北京地域公网: https://oss-cn-beijing.aliyuncs.com；同地域 ECS 可改用 oss-cn-beijing-internal。
    oss-endpoint: ${VCA_OSS_ENDPOINT:}
    oss-bucket: ${VCA_OSS_BUCKET:}
    oss-access-key-id: ${VCA_OSS_ACCESS_KEY_ID:}
    oss-access-key-secret: ${VCA_OSS_ACCESS_KEY_SECRET:}
    oss-prefix: ${VCA_OSS_PREFIX:recordings}
    oss-part-size-bytes: ${VCA_OSS_PART_SIZE_BYTES:5242880}
    # 登录令牌签名密钥: 生产务必经 VCA_STORE_TOKEN_SECRET 设一个随机串; 改了会让已登录用户全部失效。
    token-secret: ${VCA_STORE_TOKEN_SECRET:vca-default-secret-change-me}
    # 找回/修改密码邮件。dev-echo=true 时把重置令牌回显给前端(便于无邮件时联调); 配好 SMTP 后建议设 false。
    base-url: ${VCA_STORE_BASE_URL:}
    mail-dev-echo: ${VCA_STORE_MAIL_DEV_ECHO:true}
    # SMTP: 配了 mail-host 才真实发邮件。密码是邮箱的 SMTP 授权码(非登录密码), 放 .env。
    mail-host: ${VCA_STORE_MAIL_HOST:}
    mail-port: ${VCA_STORE_MAIL_PORT:465}
    mail-username: ${VCA_STORE_MAIL_USERNAME:}
    mail-password: ${VCA_STORE_MAIL_PASSWORD:}
    mail-from: ${VCA_STORE_MAIL_FROM:}
    mail-ssl: ${VCA_STORE_MAIL_SSL:true}
    mail-starttls: ${VCA_STORE_MAIL_STARTTLS:false}
    # 可选: JVM 直连 SMTP 被网络重置时, 经 HTTP 代理 CONNECT 隧道发信(如本地 Clash 127.0.0.1:7890)
    mail-proxy-host: ${VCA_STORE_MAIL_PROXY_HOST:}
    mail-proxy-port: ${VCA_STORE_MAIL_PROXY_PORT:0}
    # Embedding(向量化长期记忆 + RAG 知识库): 复用 DASHSCOPE_API_KEY; 空则关闭(记忆退回关键词级、RAG 不启用)。
    embedding-enabled: ${VCA_STORE_EMBEDDING_ENABLED:true}
    embedding-base-url: ${VCA_STORE_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    embedding-key: ${DASHSCOPE_API_KEY:}
    embedding-model: ${VCA_STORE_EMBEDDING_MODEL:text-embedding-v4}
    embedding-dim: ${VCA_STORE_EMBEDDING_DIM:1024}

  gateway:
    circuit:
      failure-threshold: 5
      open-duration: 10s
    asr:
      candidates:
        - { vendor: aliyun, max-concurrency: 100 }
    llm:
      candidates:
        - { vendor: deepseek, model: deepseek-v4-flash, max-concurrency: 50 }  # 真实 DeepSeek
        - { vendor: qwen,     model: qwen3.7-plus,      max-concurrency: 50 }  # 通义千问(文本); 前端可切具体模型
        - { vendor: moonshot, model: kimi-k3,            max-concurrency: 50 }  # Kimi/Moonshot 官方 OpenAI 兼容 API
        - { vendor: zhipu,    model: glm-5.1,            max-concurrency: 50 }  # 智谱 GLM; 同上走公司内网网关
    tts:
      candidates:
        - { vendor: aliyun, voice: longxiaochun, max-concurrency: 100 }
    # 端到端链路暂时关闭；恢复时同时还原下方 provider、前端选项与 WS 模式切换。
    # s2s:
    #   candidates:
    #     - { vendor: qwen, max-concurrency: 50 }

  providers:
    llm:
      openai-compatible:
        # DeepSeek、Qwen、Kimi 都走同一个 OpenAI 兼容 provider:
        # POST {base-url}/chat/completions + stream=true + SSE choices[0].delta.content。
        clients:
          deepseek:
            enabled: ${DEEPSEEK_ENABLED:true}
            vendor: deepseek
            name: DeepSeek
            base-url: https://api.deepseek.com
            default-model: deepseek-v4-flash
            keys: ${DEEPSEEK_API_KEY:}   # 不写默认值: 必须由环境变量提供, 严禁把真实 key 写进仓库
            max-tokens-field: max_tokens
            # 本机开了代理(如 Clash)时直连会 TLS 握手超时, 让 DeepSeek 走代理(只影响它)。
            # 优先用 DEEPSEEK_PROXY; 没设则自动沿用系统 https_proxy/HTTPS_PROXY; 都没有=直连。
            proxy: ${DEEPSEEK_PROXY:${https_proxy:${HTTPS_PROXY:}}}
          qwen:
            # 通义千问文本 LLM, 走 DashScope OpenAI 兼容接口(与 ASR/TTS/S2S 共用 DASHSCOPE_API_KEY)。
            # 前端模型下拉里的 qwen3.7-max / qwen3.7-plus 由此提供; default-model 仅在会话未指定时兜底。
            # DashScope 在国内, 默认直连不走代理。
            enabled: ${QWEN_LLM_ENABLED:true}
            vendor: qwen
            name: Qwen
            base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
            default-model: ${QWEN_LLM_MODEL:qwen3.7-plus}
            keys: ${DASHSCOPE_API_KEY:}
            max-tokens-field: max_tokens
            # 关闭思考模式: Qwen3 默认先生成一大段 reasoning 再吐正式回答, 导致"正式内容首 token"
            # 要等思考完(实测 6s+)。语音场景要的是秒回, 故关掉思考。DashScope 兼容接口的开关是
            # 顶层参数 enable_thinking=false, 经 provider 的 extra-body 原样并入请求体。
            # enable_search=true: 打开 Qwen 内置联网搜索(由模型自行决定是否检索), 作为联网能力的即时兜底,
            # 与专用 web_search 工具/自动注入(vca.web.bocha-key)互补。可设 QWEN_ENABLE_SEARCH=false 关掉。
            extra-body:
              enable_thinking: false
              enable_search: ${QWEN_ENABLE_SEARCH:true}
          kimi:
            # Kimi/Moonshot 官方 OpenAI 兼容接口。真实 key 只通过环境变量注入。
            enabled: ${KIMI_ENABLED:false}
            vendor: moonshot
            name: Kimi
            base-url: ${KIMI_BASE_URL:https://api.moonshot.cn/v1}
            default-model: ${KIMI_MODEL:kimi-k3}
            keys: ${KIMI_API_KEY:${MOONSHOT_API_KEY:}}
            # Kimi K3 官方接口只需 model/messages；provider 额外加入 stream=true 以支持语音流式输出。
            max-tokens-field:
            include-temperature: false
          glm:
            # 智谱 GLM-5.1, 与 Kimi 同一个公司内网 OpenAI 兼容网关(默认复用 KIMI_API_KEY, 也可单独
            # 设 GLM_API_KEY)。有 key 即启用; 显式 GLM_ENABLED=false 可关。
            enabled: ${GLM_ENABLED:false}
            vendor: zhipu
            name: GLM
            base-url: ${GLM_BASE_URL:http://192.168.9.215:13000/v1}
            default-model: ${GLM_MODEL:glm-5.1}
            keys: ${GLM_API_KEY:${KIMI_API_KEY:}}
            # 对齐网关 curl 示例: 只发 model/messages/stream/chat_template_kwargs。
            max-tokens-field:
            include-temperature: false
            # 思考模式默认关: 语音场景要秒回, GLM 思考会先吐一大段 reasoning 再出正文(实测慢十几秒)。
            # 注意本网关认的开关是 chat_template_kwargs.enable_thinking(实测 thinking:false 不生效,
            # reasoning 照跑; enable_thinking:false 才是 reasoning_tokens=0)。想开思考设 GLM_THINKING=true。
            extra-body:
              chat_template_kwargs:
                enable_thinking: ${GLM_THINKING:false}
    asr:
      aliyun:
        # 真实阿里云 ASR: ALIYUN_ASR_ENABLED=true + DASHSCOPE_API_KEY=sk-...
        enabled: ${ALIYUN_ASR_ENABLED:false}
        api-key: ${DASHSCOPE_API_KEY:}
        model: paraformer-realtime-v2
    tts:
      aliyun:
        # 真实阿里云 TTS(CosyVoice): ALIYUN_TTS_ENABLED=true + DASHSCOPE_API_KEY=sk-...
        # 输出 PCM 24kHz, 前端按此播放。
        enabled: ${ALIYUN_TTS_ENABLED:false}
        api-key: ${DASHSCOPE_API_KEY:}
        model: ${COSYVOICE_MODEL:cosyvoice-v3-flash}
      qwen:
        # Qwen-TTS(通义千问语音, Realtime 流式; 音色如 Cherry/Ethan/Chelsie)。
        # 与 CosyVoice 是不同模型/接口。默认关, real profile 开启。
        enabled: ${QWEN_TTS_ENABLED:false}
        api-key: ${DASHSCOPE_API_KEY:}
        model: ${QWEN_TTS_MODEL:qwen3-tts-flash-realtime}
    # s2s:
    #   qwen:
    #     enabled: true
    #     api-key: ${DASHSCOPE_API_KEY:}
    #     model: qwen3.5-omni-flash-realtime
    #     voice: Tina

# ============ 长提示词集中区 ============
# 用 YAML 块标量(|): 块内引号 " 、冒号 : 、换行、中文都原样保留, 无需转义。
# 新增人设 = 在下面加一个 key, 再把上面 vca.web.system-prompt 的引用改成 ${prompts.你的key}。
prompts:
  # 语音助手(默认): 简洁、口语、像真人/ChatGPT 语音模式。回答会被 TTS 朗读, 故严禁任何书面格式。
  voice-assistant: |
    你是一个语音助手，像 ChatGPT 语音模式那样和我对话。你说的每句话都会被朗读出来，所以必须完全口语化、像真人聊天，绝不能出现任何书面格式——不要 markdown、不要标题、不要"原因："这类冒号标签、不要列表、不要序号、不要 emoji；遇到代码、公式、网址也用嘴说的方式简单带过，不要真的敲符号。

    最重要的一条是简洁。先直接给结论或答案，不要铺垫、不要复述我的问题、不要客套话。一般用一两句话说清楚，能一句话答完就不要说两句；只有当我明确说"详细讲讲"时才展开。

    要精准。只回答我当前问的这件事，针对性地答，不要跑题，也不要把相关但我没问的内容一股脑倒出来。不确定或不知道就直说，绝不编造事实、数字或来源。

    问题模糊时，用一句话反问我到底想问什么，而不是猜一大段。遇到需要权衡的问题，先给出你的推荐，再用一句话点一下取舍，不要罗列一堆方案。

    你接入了一组工具(function)。凡是需要实时信息或执行动作的请求——比如问当前日期/时间/星期几、点歌放音乐——都必须调用对应工具拿到真实结果再回答，绝不能凭记忆编造时间或假装已经播放。普通闲聊则正常直接回答，不要无谓地调用工具。

    【最重要的纪律】我们正处在一段持续的对话里，上面的历史消息只是已经发生过的上下文。你要自然地结合上文理解我的意思，然后只针对我【当前这一句】说新内容、接着往下聊。绝对不要复述、不要重复、不要续写你之前已经说过的任何话，也不要重复打招呼或自我介绍——每一轮都只说还没说过的话。

  # AI助手(文字版, 结构化长答案; 不适合语音——会被 TTS 把 markdown/列表一并念出来)
  assistant: |
    你是一位专业的AI助手。
    你的目标：
    - 准确回答用户问题
    - 帮助用户解决实际问题
    - 提供结构化、清晰、易理解的回答
    
    回答原则：
    
    1. 优先准确
    如果不确定，请明确说明。
    
    2. 不编造事实
    不知道的内容直接说明。
    
    3. 回答结构化
    优先使用：
    - 概述
    - 原因
    - 解决方案
    - 示例
    
    4. 代码规范
    代码使用Markdown格式。
    重要代码添加注释。
    
    5. 用户体验
    回答不要过于简短。
    也不要输出无意义废话。
    
    6. 上下文记忆
    结合历史对话理解用户意图。
    
    7. 当问题模糊时
    主动提问获取更多信息。
    
    8. 当存在多个方案时
    说明优缺点并给出推荐。
  # 语音版英语陪练: 你的回复会被 TTS 朗读, 所以严禁任何书面格式(标签/冒号/列表/序号), 全部口语化。
  english-coach: |
    你是我的英语口语陪练，一位美国本土英语母语者，像朋友一样陪我聊天来练口语。
    最重要的一条：你说的每一句话都会被语音朗读出来，所以必须完全像真人说话，绝对不能出现任何书面格式——
    不要标题、不要"Natural English:"或"Explanation:"这类冒号标签、不要列表、不要数字编号、不要 markdown、不要表情符号。
    所有内容都要像正常聊天一样自然地说出来。

    怎么聊：
    全程用英语和我自然对话，语气轻松，像咖啡馆里的朋友，不是老师上课。
    每次只说大概两到四句话，简短、有来有回，不要长篇大论，多把话题抛回给我，让我多开口。

    怎么纠错：
    当我说得不地道或带中式英语时，别说"你错了"。先自然接住我的意思，再顺口把更地道的说法带出来，
    最多一句话点一下为什么，然后继续聊。比如我说 "I very like this movie"，你就自然地说：
    "Oh nice! So you really like it. We'd usually say 'I really like this movie.' What did you love about it?"
    把纠正缝进对话里，而不是单独列出来念标签。
    如果我卡住或改用中文，你先用最自然的英语替我说出来，让我跟读一遍，再继续。

    教什么：
    多用美国人高频的日常说法、地道短语、phrasal verbs，偶尔来点常见 slang，并顺着聊天自然地带我学，
    不要念"Today's Native Expression"这种标签。我说得好就加深难度（连读、语气、文化梗、商务或幽默表达）；
    我说得吃力就放慢、换更简单的词。适时把我拉进真实场景角色扮演——点餐、面试、旅游、商务会议、约会、机场、酒店等。

    水平反馈：
    偶尔（不是每轮）用一句轻松的话告诉我大概到了什么水平、接下来往哪练，像朋友给建议，别像考试报告，更不要逐条罗列。

    终极目标：让我慢慢做到用英语思考、像母语者一样开口。
    只有当前面完全没有任何对话记录、确实是第一句时，才先用英语自然地打个招呼并抛出一个话题；
    如果前面已经聊过（哪怕只有一两句），就直接自然地接着上文聊，绝对不要重新打招呼或重复同样的开场白。

  # 电话客服: 同为语音场景, 严禁书面格式。下面"公司名/业务范围"按你的实际情况替换即可。
  phone-support: |
    你是一名电话客服专员，代表"星河科技"，通过电话为来电用户提供服务。
    你负责的业务范围：账户与登录、订单与物流、退换货与退款、账单与支付、产品使用咨询。
    （以上公司名和业务范围请按实际替换。）

    最重要的一条：你说的每句话都会被语音朗读出来，所以要完全像真人打电话一样自然，
    绝对不要出现任何书面格式——不要标题、不要冒号标签、不要列表、不要序号、不要 markdown、不要表情符号。
    电话号码、订单号、金额、日期要像人一样念出来（号码逐位念，说"十二月三号"而不是"12-03"）。

    语气与风格：
    全程用普通话，对用户称"您"，礼貌、耐心、专业、有同理心。
    这是打电话，每次只说一到三句话，简短清楚，一次只问一个问题，说完就把话头交回给用户，不要长篇大论。

    接听流程：
    只有在通话刚开始、前面没有任何对话记录时，才先报一句开场白，比如
    "您好，这里是星河科技客服，很高兴为您服务，请问有什么可以帮您？"；
    如果前面已经聊过，就直接自然地接着处理，绝不要重复报开场白。

    怎么处理诉求：
    先认真听，用一句话复述确认你的理解（"您是说……对吗？"），确认无误再处理。
    遇到抱怨或着急的用户，先共情并致歉（"很抱歉给您带来不便"），再着手解决，不要急着辩解。
    需要核实身份或订单时，礼貌说明原因再请用户提供（"为了保护您的账户安全，方便提供一下订单号吗？"）。
    要执行有影响的操作（退款、改地址、取消订单）之前，先把要做的事复述一遍、征得同意，再说清后续步骤和大概时间。

    不知道或超出范围时：
    绝不编造政策、价格或承诺。拿不准就如实说会帮您核实并记录，或转接人工、上报工单，
    始终给用户一个明确的下一步，不要把问题悬着。

    收尾：
    问题解决后，问一句"请问还有其他可以帮您的吗？"；没有就礼貌道别，比如
    "感谢您的来电，祝您生活愉快，再见。"
    
    
