# 真实语音 Profile: 用 `--spring.profiles.active=real` 激活。
# 全链路真实厂商: 阿里云 ASR + Qwen/CosyVoice TTS + DeepSeek LLM。
# 需设 DEEPSEEK_API_KEY=sk-...(默认已内置一个), 并确保代理可用。

vca:
  web:
    llm-vendor: ${VCA_LLM_VENDOR:deepseek} # deepseek / qwen / moonshot
    llm-model: ${VCA_LLM_MODEL:}
    # 默认 aliyun(Qwen-Audio-3.0-TTS-Flash, 每句新建连接, 实测首音~1.8s —— 与上一代 cosyvoice-v3-flash
    # 持平: 瓶颈在"每句一条新连接"的建连开销, 不在模型, 官方那个 300ms 首包是长连上的数)。
    # 设 VCA_TTS_VENDOR=qwen 切到 Qwen3-TTS(realtime, 每轮只连一次、流式首包, 通常更快);
    # 音色由 gateway 候选给(qwen→Cherry)。
    tts-vendor: ${VCA_TTS_VENDOR:aliyun}
    tts-voice: longanhuan_v3.6  # 仅当 gateway 候选未指定音色时兜底; 实际音色以候选为准

  gateway:
    tts:
      candidates:
        - { vendor: aliyun, voice: longanhuan_v3.6, max-concurrency: 100 }  # 主: Qwen-Audio-3.0-TTS-Flash
        - { vendor: qwen,   voice: Cherry,          max-concurrency: 100 }  # 备: Qwen3-TTS 兜底

  providers:
    llm:
      openai-compatible:
        clients:
          deepseek:
            # 本机直连 DeepSeek 的 TLS 握手极不稳定(实测约 6 成超时), 默认走本地代理。
            # 没开代理/想直连时: 启动设 DEEPSEEK_PROXY= (置空) 覆盖即可。
            proxy: ${DEEPSEEK_PROXY:http://127.0.0.1:7890}
    asr:
      aliyun:
        enabled: true
    tts:
      aliyun:
        enabled: true     # 主: Qwen-Audio-3.0-TTS(音色是 CosyVoice 体系时自动回落 cosyvoice-v3-flash)
      qwen:
        enabled: true     # 备: Qwen3-TTS(Cherry)
